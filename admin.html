<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>QR Generator</title>

<style>

body {
    font-family: Arial;
    background: #f3f4f6;
    padding: 20px;
}

h1 {
    text-align: center;
}

#qrs {

    display: grid;

    grid-template-columns:
        repeat(auto-fit, minmax(250px, 1fr));

    gap: 20px;

}

.qr {

    background: white;

    padding: 20px;

    border-radius: 15px;

    text-align: center;

}

.qr img {

    margin: 10px;

}

a {

    display: inline-block;

    padding: 10px;

    background: #111827;

    color: white;

    text-decoration: none;

    border-radius: 8px;

}

</style>

</head>


<body>

<h1>🖨️ QR Code Generator</h1>

<p style="text-align:center">

Open this page after GitHub Pages is published.

</p>

<div id="qrs"></div>


<script src="config.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>


<script>

const container =
    document.getElementById("qrs");


const baseURL =
    window.location.origin +
    window.location.pathname
    .replace("admin.html", "");


HUNT_CONFIG.qrs.forEach(qr => {

    const box =
        document.createElement("div");

    box.className = "qr";

    const title =
        document.createElement("h2");

    title.textContent =
        "QR " + qr.id;

    box.appendChild(title);


    const qrBox =
        document.createElement("div");

    box.appendChild(qrBox);


    const url =
        baseURL + "?qr=" + qr.id;


    new QRCode(qrBox, {

        text: url,

        width: 220,

        height: 220,

        correctLevel:
            QRCode.CorrectLevel.H

    });


    const download =
        document.createElement("a");

    download.textContent =
        "Download QR " + qr.id;

    download.href = "#";


    setTimeout(() => {

        const image =
            qrBox.querySelector("img");

        if (image) {

            download.href =
                image.src;

            download.download =
                "QR-" + qr.id + ".png";

        }

    }, 500);


    box.appendChild(download);


    const text =
        document.createElement("p");

    text.style =
        "word-break:break-all;font-size:12px";

    text.textContent = url;

    box.appendChild(text);


    container.appendChild(box);

});

</script>

</body>

</html>
